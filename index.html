<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weekly Ad</title>
  <style>
    body { margin: 0; }

    #flipp-container {
      width: 100%;
    }

    /* Desktop: container (and the iframe inside it) takes 70% of page width, centered */
    @media (min-width: 1024px) {
      #flipp-container {
        width: 70%;
        margin: 0 auto;
      }
      #flipp-container iframe {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="flipp-container"></div>

  <!-- Load synchronously while the page is loading -->
  <script
    src="https://aq.flippenterprise.net/7160/iframe.js"
    id="flipp-storefront-script"
  ></script>
  <script>
    var flippContainer = document.querySelector("#flipp-container");
    var storefront = new Flipp.Storefront({
      accessToken: "1b661b90129a751d6864b6b5dafa74a1",
      merchantId: "7160",
      merchantNameIdentifier: "pcexpress",
      locale: "en-CA"
    });
    storefront.renderStorefront(flippContainer);
  </script>
</body>
</html>
